<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calendario</title>
    <link rel="stylesheet" href="css/stylke.css">
</head>
<body>
    <div class="container">

        <div class="fecha">
            <input type="text" placeholder="dd / mm / yyyy">
            <button class="flecha">▦</button>

            </div>

                <tr class="dias">
                    <th>D</th>
                    <th>L</th>
                    <th>M</th>
                    <th>M</th>
                    <th>J</th>
                    <th>V</th>
                    <th>S</th>
                </tr>
                <tr>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td class="dia">1</td>
                    <td class="dia">2</td>
                    <td class="dia">3</td>
                </tr>
                <tr>
                    <td class="dia">4</td>
                    <td class="dia">5</td>
                    <td class="dia">6</td>
                    <td class="dia">7</td>
                    <td class="dia">8</td>
                    <td class="dia">9</td>
                    <td class="dia">10</td>
                </tr>
                <tr>
                    <td class="dia">11</td>
                    <td class="dia">12</td>
                    <td class="dia">13</td>
                    <td class="dia">14</td>
                    <td class="dia">15</td>

                    <td class="dia">17</td>
                </tr>

                    <td class="dia">18</td>
                    <td class="dia">19</td>

                    <td class="dia">21</td>
                    <td class="dia">22</td>
                    <td class="dia">23</td>
                    <td class="dia">24</td>
                </tr>
                <tr>
                    <td class="dia">25</td>
                    <td class="dia">26</td>
                    <td class="dia">27</td>
                    <td class="dia">28</td>
                    <td class="dia">29</td>
                    <td class="dia">30</td>
                    <td class="dia">31</td>
                </tr>
            </table>

        </div>
    </div>
</body>
</html>
